name: Build IPA

# Builds the IPA for a release and attaches it to that release. The IPA is
# ad-hoc signed with the entitlements of the app and its share extension, so
# AltStore and SideStore can register the App Group when they re-sign it.
#
# Runs when a release is published or a version tag is pushed. Manual runs can
# build the selected branch, or an existing tag when one is supplied. Every
# run uploads an IPA artifact; runs for an existing release also attach it to
# that release, replacing an asset with the same name.

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build (leave empty to build the selected branch)
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: build-ipa-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: xcode-27
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.sha }}

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Use the current build script
        # Tags made before this workflow existed have no build script
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --depth=1 origin "$DEFAULT_BRANCH"
          git checkout FETCH_HEAD -- .github/scripts/build-ipa.sh

      - name: Build IPA
        id: build
        run: .github/scripts/build-ipa.sh "$RUNNER_TEMP/ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: GestaltX_${{ steps.build.outputs.version }}_${{ github.run_number }}
          path: ${{ steps.build.outputs.ipa }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload to release
        if: github.event_name == 'release' || github.ref_type == 'tag' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          IPA: ${{ steps.build.outputs.ipa }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IPA" --clobber
          else
            echo "::notice::No GitHub Release exists for $TAG; IPA is available as this workflow run's artifact."
          fi
